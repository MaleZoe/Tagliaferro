<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#f5efeb; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2f4156" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- BACKGROUND CANVAS (Cream) -->
  <rect width="1440" height="900" fill="#f5efeb" />

  <!-- ==================== SIDEBAR (260px, #2f4156) ==================== -->
  <g id="Sidebar">
    <rect x="0" y="0" width="260" height="900" fill="#2f4156" />

    <!-- Brand Header -->
    <g transform="translate(14, 18)">
      <!-- Logo Mark -->
      <rect x="0" y="0" width="52" height="52" rx="8" fill="#f5efeb" stroke="#567c8d" stroke-width="1" />
      <!-- Crest in logo -->
      <path d="M18 16 L26 36 L34 16 Z" fill="#2f4156" opacity="0.8" />
      <text x="26" y="28" fill="#2f4156" font-size="9" font-weight="900" text-anchor="middle" font-family="Georgia, serif">ES</text>

      <!-- Brand Copy -->
      <text x="64" y="24" fill="#ffffff" font-size="13" font-weight="800" letter-spacing="1.2">ÉLITE SPORT</text>
      <text x="64" y="42" fill="#f5efeb" font-size="11" opacity="0.9">Administración</text>

      <line x1="0" y1="68" x2="232" y2="68" stroke="rgba(255,255,255,0.13)" stroke-width="1" />
    </g>

    <!-- Nav Caption -->
    <text x="24" y="116" fill="#9caebc" font-size="10" font-weight="700" letter-spacing="1.2">OPERACIÓN</text>

    <!-- Item 1: Dashboard (ACTIVE - Pill #567c8d) -->
    <g transform="translate(12, 130)">
      <!-- Active bar on the edge -->
      <rect x="-12" y="8" width="4" height="30" rx="2" fill="#f5efeb" />
      <!-- Active pill background -->
      <rect x="0" y="0" width="236" height="46" rx="8" fill="#567c8d" />
      <!-- Inverted Icon box -->
      <rect x="6" y="5" width="36" height="36" rx="8" fill="#f5efeb" />
      <g transform="translate(17, 16)" fill="#2f4156">
        <rect x="0" y="0" width="5" height="5" rx="1" />
        <rect x="8" y="0" width="5" height="5" rx="1" />
        <rect x="0" y="8" width="5" height="5" rx="1" />
        <rect x="8" y="8" width="5" height="5" rx="1" />
      </g>
      <text x="54" y="28" fill="#ffffff" font-size="13" font-weight="600">Dashboard</text>
    </g>

    <!-- Item 2: Productos y stock -->
    <g transform="translate(12, 184)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <path d="M18 18l6-3.5 6 3.5v7l-6 3.5-6-3.5z M24 14.5v14" fill="none" stroke="#f5efeb" stroke-width="1.4" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Productos y stock</text>
    </g>

    <!-- Item 3: Caja del local -->
    <g transform="translate(12, 238)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <rect x="17" y="17" width="14" height="11" rx="2" fill="none" stroke="#f5efeb" stroke-width="1.4" />
      <circle cx="24" cy="22.5" r="1.5" fill="#f5efeb" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Caja del local</text>
    </g>

    <!-- Item 4: Ventas online -->
    <g transform="translate(12, 292)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <path d="M16 28l4-5 3 2 5-6" fill="none" stroke="#f5efeb" stroke-width="1.4" stroke-linecap="round" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Ventas online</text>
    </g>

    <!-- Item 5: Pedidos -->
    <g transform="translate(12, 346)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <rect x="18" y="16" width="12" height="13" rx="1" fill="none" stroke="#f5efeb" stroke-width="1.4" />
      <line x1="20" y1="20" x2="28" y2="20" stroke="#f5efeb" stroke-width="1.4" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Pedidos</text>
    </g>

    <!-- Item 6: Clientes -->
    <g transform="translate(12, 400)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <circle cx="24" cy="20" r="2.5" fill="none" stroke="#f5efeb" stroke-width="1.4" />
      <path d="M19 28c0-2 2-3 5-3s5 1 5 3" fill="none" stroke="#f5efeb" stroke-width="1.4" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Clientes</text>
    </g>

    <!-- Item 7: Proveedores -->
    <g transform="translate(12, 454)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <rect x="16" y="18" width="9" height="8" fill="none" stroke="#f5efeb" stroke-width="1.3" />
      <path d="M25 21h4l2 2.5v2.5h-6z" fill="none" stroke="#f5efeb" stroke-width="1.3" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Proveedores</text>
    </g>

    <!-- Item 8: Movimientos de stock -->
    <g transform="translate(12, 508)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <path d="M17 21h13 M27 18l3 3-3 3" fill="none" stroke="#f5efeb" stroke-width="1.4" stroke-linecap="round" />
      <path d="M30 25H17 M20 22l-3 3 3 3" fill="none" stroke="#f5efeb" stroke-width="1.4" stroke-linecap="round" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Movimientos de stock</text>
    </g>

    <!-- Item 9: Reportes -->
    <g transform="translate(12, 562)">
      <rect x="6" y="5" width="36" height="36" rx="8" fill="rgba(86,124,141,0.22)" stroke="rgba(245,239,235,0.34)" stroke-width="1" />
      <line x1="18" y1="28" x2="18" y2="22" stroke="#f5efeb" stroke-width="2" stroke-linecap="round" />
      <line x1="24" y1="28" x2="24" y2="17" stroke="#f5efeb" stroke-width="2" stroke-linecap="round" />
      <line x1="30" y1="28" x2="30" y2="24" stroke="#f5efeb" stroke-width="2" stroke-linecap="round" />
      <text x="54" y="28" fill="#d1dae1" font-size="13" font-weight="500">Reportes</text>
    </g>

    <!-- Bottom Actions -->
    <g transform="translate(24, 820)">
      <line x1="-10" y1="0" x2="222" y2="0" stroke="rgba(255,255,255,0.13)" stroke-width="1" />
      <text x="0" y="26" fill="#cbd5dd" font-size="12" font-weight="500">↖  Volver a la tienda</text>
      <text x="0" y="56" fill="#cbd5dd" font-size="12" font-weight="500">→  Cerrar sesión</text>
    </g>
  </g>

  <!-- ==================== TOPBAR ==================== -->
  <g id="Topbar" transform="translate(260, 0)">
    <rect width="1180" height="54" fill="#ffffff" />
    <line x1="0" y1="54" x2="1180" y2="54" stroke="#e7eaee" stroke-width="1" />

    <text x="32" y="32" fill="#697581" font-size="12" font-weight="400">Panel administrativo</text>
    <text x="156" y="32" fill="#2f4156" font-size="12" font-weight="600">salviamale08@gmail.com</text>

    <!-- Role Badge -->
    <g transform="translate(1048, 14)">
      <rect width="96" height="26" rx="13" fill="#eef2f5" />
      <text x="48" y="17" fill="#526475" font-size="11" font-weight="500" text-anchor="middle">Administrador</text>
    </g>
  </g>

  <!-- ==================== DASHBOARD CONTENT AREA ==================== -->
  <g id="Content" transform="translate(290, 80)">

    <!-- Title & Subtitle -->
    <text x="0" y="14" fill="#567c8d" font-size="11" font-weight="700" letter-spacing="1.2">CENTRO DE OPERACIONES</text>
    <text x="0" y="48" fill="#2f4156" font-size="34" font-weight="700" font-family="Georgia, serif">Dashboard</text>
    <text x="0" y="74" fill="#567c8d" font-size="13">Una vista clara de las ventas y el estado de tu tienda.</text>

    <!-- Controls (Top Right) -->
    <g transform="translate(850, 26)">
      <!-- Date label -->
      <text x="-24" y="14" fill="#2f4156" font-size="12" font-weight="600" text-anchor="end">Martes, 20 De Octubre</text>
      
      <!-- Period dropdown -->
      <text x="0" y="-8" fill="#64748b" font-size="10" font-weight="600">Periodo</text>
      <rect x="0" y="0" width="100" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="21" fill="#2f4156" font-size="12" font-weight="500">Hoy</text>
      <path d="M78 18l4 4 4-4" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Actualizar button (#2f4156) -->
      <g transform="translate(112, 0)">
        <rect width="98" height="34" rx="6" fill="#2f4156" />
        <path d="M18 17a5 5 0 1 1 1 3 M18 14v3h3" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="21" fill="#ffffff" font-size="12" font-weight="600">Actualizar</text>
      </g>
    </g>

    <!-- ==================== 4 KPI CARDS ==================== -->
    <!-- Card 1: Ventas del período (NAVY #2f4156) -->
    <g transform="translate(0, 102)" filter="url(#soft-shadow)">
      <rect width="258" height="128" rx="8" fill="#2f4156" />
      <text x="18" y="32" fill="#ffffff" font-size="13" font-weight="700">Ventas del período</text>
      <!-- Icon pill top right -->
      <rect x="208" y="18" width="32" height="32" rx="6" fill="rgba(255,255,255,0.12)" />
      <rect x="217" y="26" width="14" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.4" />
      
      <!-- Big Value -->
      <text x="18" y="76" fill="#ffffff" font-size="28" font-weight="700" font-family="Georgia, serif">$ 0</text>
      <!-- Subtitle -->
      <text x="18" y="104" fill="rgba(255,255,255,0.8)" font-size="11">Ingresos confirmados</text>
    </g>

    <!-- Card 2: Ventas del local (WHITE + Cyan top accent) -->
    <g transform="translate(272, 102)" filter="url(#soft-shadow)">
      <rect width="258" height="128" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="3" height="128" rx="1.5" fill="#567c8d" />
      <text x="18" y="32" fill="#2f4156" font-size="13" font-weight="700">Ventas del local</text>
      <!-- Icon pill -->
      <rect x="208" y="18" width="32" height="32" rx="6" fill="#f8fafc" />
      <rect x="216" y="26" width="16" height="14" rx="2" fill="none" stroke="#567c8d" stroke-width="1.4" />
      
      <text x="18" y="76" fill="#2f4156" font-size="28" font-weight="700" font-family="Georgia, serif">$ 0</text>
      <text x="18" y="104" fill="#567c8d" font-size="11">Punto de venta</text>
    </g>

    <!-- Card 3: Ventas online (WHITE + Blue top accent) -->
    <g transform="translate(544, 102)" filter="url(#soft-shadow)">
      <rect width="258" height="128" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="3" height="128" rx="1.5" fill="#6366f1" />
      <text x="18" y="32" fill="#2f4156" font-size="13" font-weight="700">Ventas online</text>
      <!-- Icon pill -->
      <rect x="208" y="18" width="32" height="32" rx="6" fill="#f8fafc" />
      <path d="M218 34l4-5 3 2 5-6" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" />
      
      <text x="18" y="76" fill="#2f4156" font-size="28" font-weight="700" font-family="Georgia, serif">$ 0</text>
      <text x="18" y="104" fill="#567c8d" font-size="11">Pedidos confirmados</text>
    </g>

    <!-- Card 4: Pedidos pendientes (WHITE + Amber accent) -->
    <g transform="translate(816, 102)" filter="url(#soft-shadow)">
      <rect width="258" height="128" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="3" height="128" rx="1.5" fill="#f59e0b" />
      <text x="18" y="32" fill="#2f4156" font-size="13" font-weight="700">Pedidos pendientes</text>
      <!-- Icon pill -->
      <rect x="208" y="18" width="32" height="32" rx="6" fill="#f8fafc" />
      <rect x="218" y="25" width="12" height="15" rx="1" fill="none" stroke="#f59e0b" stroke-width="1.4" />
      
      <text x="18" y="76" fill="#2f4156" font-size="28" font-weight="700" font-family="Georgia, serif">0</text>
      <text x="18" y="104" fill="#567c8d" font-size="11">Pendientes de seguimiento</text>
    </g>

    <!-- ==================== MIDDLE ROW ==================== -->
    <!-- Left Card: Rendimiento / Ingresos por día -->
    <g transform="translate(0, 252)" filter="url(#soft-shadow)">
      <rect width="700" height="360" rx="8" fill="#ffffff" />
      <text x="24" y="30" fill="#567c8d" font-size="11" font-weight="700" letter-spacing="1.2">RENDIMIENTO</text>
      <text x="24" y="58" fill="#2f4156" font-size="22" font-weight="700" font-family="Georgia, serif">Ingresos por día</text>
      <text x="24" y="80" fill="#567c8d" font-size="12">Ventas completadas en el período seleccionado.</text>

      <!-- Legend (Top Right) -->
      <g transform="translate(560, 52)">
        <rect x="0" y="-4" width="8" height="8" rx="2" fill="#2f4156" />
        <text x="14" y="4" fill="#2f4156" font-size="11" font-weight="600">Local</text>

        <rect x="52" y="-4" width="8" height="8" rx="2" fill="#567c8d" />
        <text x="66" y="4" fill="#567c8d" font-size="11" font-weight="600">Online</text>
      </g>

      <!-- Horizontal Dashed Grid lines -->
      <line x1="24" y1="120" x2="676" y2="120" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="24" y1="170" x2="676" y2="170" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="24" y1="220" x2="676" y2="220" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="24" y1="270" x2="676" y2="270" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="24" y1="310" x2="676" y2="310" stroke="#e2e8f0" stroke-width="1" />

      <!-- Empty state / Axis -->
      <text x="350" y="210" fill="#94a3b8" font-size="12" font-style="italic" text-anchor="middle">Sin registros de ventas en este día</text>
      <text x="350" y="332" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Hoy</text>
    </g>

    <!-- Right Card: Operación / Resumen operativo -->
    <g transform="translate(724, 252)" filter="url(#soft-shadow)">
      <rect width="350" height="360" rx="8" fill="#ffffff" />
      <text x="24" y="30" fill="#567c8d" font-size="11" font-weight="700" letter-spacing="1.2">OPERACIÓN</text>
      <text x="24" y="58" fill="#2f4156" font-size="22" font-weight="700" font-family="Georgia, serif">Resumen operativo</text>
      <text x="24" y="80" fill="#567c8d" font-size="12">Cobros y disponibilidad del catálogo.</text>

      <!-- Item 1: Efectivo -->
      <g transform="translate(24, 110)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#f8fafc" />
        <rect x="6" y="7" width="16" height="12" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.3" />
        <text x="40" y="19" fill="#567c8d" font-size="13" font-weight="500">Efectivo</text>
        <text x="302" y="19" fill="#2f4156" font-size="14" font-weight="700" font-family="Georgia, serif" text-anchor="end">$ 0</text>
        <line x1="0" y1="38" x2="302" y2="38" stroke="#f1f5f9" stroke-width="1" />
      </g>

      <!-- Item 2: Otros medios -->
      <g transform="translate(24, 164)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#f8fafc" />
        <rect x="6" y="8" width="16" height="11" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.3" />
        <circle cx="14" cy="13.5" r="1.5" fill="#64748b" />
        <text x="40" y="19" fill="#567c8d" font-size="13" font-weight="500">Otros medios</text>
        <text x="302" y="19" fill="#2f4156" font-size="14" font-weight="700" font-family="Georgia, serif" text-anchor="end">$ 0</text>
        <line x1="0" y1="38" x2="302" y2="38" stroke="#f1f5f9" stroke-width="1" />
      </g>

      <!-- Item 3: Productos activos -->
      <g transform="translate(24, 218)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#f8fafc" />
        <path d="M9 9l5-2.5 5 2.5v5l-5 2.5-5-2.5z" fill="none" stroke="#64748b" stroke-width="1.3" />
        <text x="40" y="19" fill="#567c8d" font-size="13" font-weight="500">Productos activos</text>
        <text x="302" y="19" fill="#2f4156" font-size="15" font-weight="700" font-family="Georgia, serif" text-anchor="end">39</text>
        <line x1="0" y1="38" x2="302" y2="38" stroke="#f1f5f9" stroke-width="1" />
      </g>

      <!-- Item 4: Stock bajo -->
      <g transform="translate(24, 272)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#f8fafc" />
        <path d="M14 6l9 16H5z M14 12v4 M14 18h.01" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" />
        <text x="40" y="19" fill="#567c8d" font-size="13" font-weight="500">Stock bajo</text>
        <text x="302" y="19" fill="#2f4156" font-size="15" font-weight="700" font-family="Georgia, serif" text-anchor="end">0</text>
      </g>
    </g>

  </g>
</svg>
